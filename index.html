<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gransdraknet Remote v12</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#000;
            color:#fff;
            font-family:'Courier New',monospace;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow-x:hidden;
        }
        .container{
            width:100%;
            max-width:420px;
            background:#0a0a0a;
            border:1px solid #1a1a1a;
            border-radius:16px;
            padding:16px;
            box-shadow:0 0 40px rgba(0,255,136,0.15);
        }
        .header{
            text-align:center;
            padding:10px 0;
            border-bottom:1px solid #1a1a1a;
            margin-bottom:14px;
        }
        .header h1{
            font-size:1.6em;
            background:linear-gradient(45deg,#00ff88,#00b4d8);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            letter-spacing:2px;
        }
        .header .ver{
            font-size:0.7em;
            color:#555;
        }
        .status-row{
            display:flex;
            align-items:center;
            gap:8px;
            padding:8px 12px;
            background:#111;
            border-radius:8px;
            margin-bottom:12px;
            border:1px solid #1a1a1a;
        }
        .dot{
            width:10px;height:10px;
            border-radius:50%;
            background:red;
            box-shadow:0 0 8px red;
            transition:.3s;
        }
        .dot.on{
            background:#00ff88;
            box-shadow:0 0 15px #00ff88;
        }
        .status-text{
            font-size:0.8em;
            color:#888;
        }
        .ip-row{
            display:flex;
            gap:8px;
            margin-bottom:14px;
        }
        .ip-row input{
            flex:1;
            padding:10px;
            background:#111;
            border:1px solid #1a1a1a;
            color:#0f0;
            border-radius:6px;
            font-family:monospace;
            font-size:0.85em;
            outline:none;
        }
        .ip-row input:focus{
            border-color:#00ff88;
        }
        .btn{
            padding:10px 16px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
            font-size:0.75em;
            letter-spacing:1px;
            text-transform:uppercase;
            transition:.2s;
            font-family:monospace;
        }
        .btn:active{transform:scale(0.93);}
        .btn-connect{
            background:#00ff88;
            color:#000;
        }
        .btn-disconnect{
            background:#c0392b;
            color:#fff;
        }
        .grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:8px;
        }
        .card{
            aspect-ratio:1;
            background:#0f0f0f;
            border:1px solid #1a1a1a;
            border-radius:10px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:6px;
            cursor:pointer;
            transition:.2s;
            font-size:0.65em;
            color:#aaa;
            user-select:none;
            -webkit-tap-highlight-color:transparent;
        }
        .card:active{
            background:#1a1a1a;
            transform:scale(0.94);
            border-color:#00ff88;
        }
        .card .icon{
            font-size:2em;
        }
        .card.flash-active{
            border-color:#ff0;
            box-shadow:0 0 20px rgba(255,255,0,0.5);
            background:#1a1a00;
            color:#ff0;
        }
        .info-row{
            display:flex;
            justify-content:space-between;
            padding:10px 12px;
            background:#111;
            border-radius:8px;
            margin-top:12px;
            border:1px solid #1a1a1a;
            font-size:0.75em;
            color:#888;
        }
        .log-box{
            margin-top:12px;
            background:#050505;
            border:1px solid #1a1a1a;
            border-radius:8px;
            height:100px;
            overflow-y:auto;
            padding:8px;
            font-size:0.65em;
        }
        .log-line{
            padding:2px 0;
            border-bottom:1px solid #0a0a0a;
            font-family:monospace;
        }
        .log-ok{color:#00ff88;}
        .log-err{color:#ff4444;}
        .log-info{color:#00b4d8;}
        .quick-row{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:6px;
            margin-top:10px;
        }
        .quick-btn{
            padding:8px;
            background:#0f0f0f;
            border:1px solid #1a1a1a;
            border-radius:6px;
            color:#aaa;
            cursor:pointer;
            font-size:0.6em;
            text-align:center;
            transition:.2s;
            font-family:monospace;
        }
        .quick-btn:active{
            background:#1a1a1a;
            border-color:#00b4d8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚡ GRANSDRAKNET</h1>
        <span class="ver">REMOTE CONTROL v12.0</span>
    </div>

    <div class="status-row">
        <div class="dot" id="statusDot"></div>
        <span class="status-text" id="statusLabel">DISCONNECTED</span>
    </div>

    <div class="ip-row">
        <input type="text" id="ipInput" placeholder="192.168.x.x:8080" value="">
        <button class="btn btn-connect" id="btnConn" onclick="toggleConnection()">CONNECT</button>
    </div>

    <div class="grid">
        <div class="card" id="flashCard" onclick="sendCmd('flashlight')">
            <span class="icon">🔦</span>SENTER
        </div>
        <div class="card" onclick="sendCmd('launch','camera')">
            <span class="icon">📷</span>KAMERA
        </div>
        <div class="card" onclick="sendCmd('launch','youtube')">
            <span class="icon">▶️</span>YOUTUBE
        </div>
        <div class="card" onclick="sendCmd('launch','tiktok')">
            <span class="icon">🎵</span>TIKTOK
        </div>
        <div class="card" onclick="sendCmd('launch','instagram')">
            <span class="icon">📱</span>IG
        </div>
        <div class="card" onclick="sendCmd('launch','whatsapp')">
            <span class="icon">💬</span>WA
        </div>
        <div class="card" onclick="sendCmd('volume','up')">
            <span class="icon">🔊</span>VOL+
        </div>
        <div class="card" onclick="sendCmd('volume','down')">
            <span class="icon">🔉</span>VOL-
        </div>
        <div class="card" onclick="sendCmd('wifi')">
            <span class="icon">📶</span>WIFI
        </div>
        <div class="card" onclick="sendCmd('bluetooth')">
            <span class="icon">📡</span>BT
        </div>
        <div class="card" onclick="sendCmd('screenshot')">
            <span class="icon">📸</span>SS
        </div>
        <div class="card" onclick="sendCmd('lock')">
            <span class="icon">🔒</span>LOCK
        </div>
    </div>

    <div class="quick-row">
        <button class="quick-btn" onclick="sendCmd('home')">🏠 HOME</button>
        <button class="quick-btn" onclick="sendCmd('back')">⬅ BACK</button>
        <button class="quick-btn" onclick="sendCmd('recent')">📋 RECENT</button>
        <button class="quick-btn" onclick="sendCmd('notif')">🔔 NOTIF</button>
    </div>

    <div class="info-row">
        <span>🔋 <span id="battLevel">--%</span></span>
        <span>📡 <span id="connType">WLAN</span></span>
        <span>⏱ <span id="uptime">--</span></span>
    </div>

    <div class="log-box" id="logBox">
        <div class="log-line log-info">[SYSTEM] Gransdraknet ready...</div>
    </div>
</div>

<script>
let ws = null;
let connected = false;
let deviceIP = '';
let flashlightOn = false;

function log(msg, type='info'){
    const box = document.getElementById('logBox');
    const time = new Date().toLocaleTimeString();
    const cls = type==='ok'?'log-ok':type==='err'?'log-err':'log-info';
    box.innerHTML += `<div class="log-line ${cls}">[${time}] ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
}

function updateUI(status){
    connected = status;
    const dot = document.getElementById('statusDot');
    const label = document.getElementById('statusLabel');
    const btn = document.getElementById('btnConn');
    if(status){
        dot.classList.add('on');
        label.textContent = `CONNECTED → ${deviceIP}`;
        label.style.color = '#00ff88';
        btn.textContent = 'DISCONNECT';
        btn.className = 'btn btn-disconnect';
    }else{
        dot.classList.remove('on');
        label.textContent = 'DISCONNECTED';
        label.style.color = '#888';
        btn.textContent = 'CONNECT';
        btn.className = 'btn btn-connect';
        document.getElementById('flashCard').classList.remove('flash-active');
        flashlightOn = false;
    }
}

async function toggleConnection(){
    if(connected){
        if(ws){ ws.close(); ws=null; }
        updateUI(false);
        log('Disconnected','err');
        return;
    }
    const ip = document.getElementById('ipInput').value.trim();
    if(!ip){ log('ISI IP DULU BRO!','err'); return; }
    deviceIP = ip;
    log(`Connecting to ${ip}...`,'info');

    try{
        ws = new WebSocket(`ws://${ip}`);
        ws.onopen = ()=>{
            updateUI(true);
            log('Connected!','ok');
            fetchBattery();
        };
        ws.onmessage = (e)=>{
            try{
                const data = JSON.parse(e.data);
                if(data.type==='battery'){
                    document.getElementById('battLevel').textContent = data.level+'%';
                }
                log(data.message || e.data,'ok');
            }catch(ex){
                log(e.data,'ok');
            }
        };
        ws.onerror = ()=>{
            log('WebSocket failed, trying HTTP...','err');
            httpConnect(ip);
        };
        ws.onclose = ()=>{
            if(connected) updateUI(false);
            log('Connection lost','err');
        };
        setTimeout(()=>{ if(!connected) httpConnect(ip); },2000);
    }catch(e){
        httpConnect(ip);
    }
}

async function httpConnect(ip){
    try{
        const res = await fetch(`http://${ip}/api/status`,{mode:'cors'});
        if(res.ok){
            updateUI(true);
            log('Connected via HTTP!','ok');
            fetchBattery();
        }else{
            log('Server not responding','err');
            updateUI(false);
        }
    }catch(e){
        log('GAGAL CONNECT! Cek IP & pastikan server nyala','err');
        updateUI(false);
    }
}

function sendCmd(endpoint, param=null){
    if(!connected){ log('BELUM CONNECT BRO!','err'); return; }
    const payload = {endpoint:endpoint};
    if(param && endpoint==='launch') payload.app = param;
    if(param && endpoint==='volume') payload.action = param;
    if(endpoint==='flashlight'){
        flashlightOn = !flashlightOn;
        payload.state = flashlightOn?'on':'off';
        const card = document.getElementById('flashCard');
        if(flashlightOn) card.classList.add('flash-active');
        else card.classList.remove('flash-active');
    }

    if(ws && ws.readyState === WebSocket.OPEN){
        ws.send(JSON.stringify(payload));
        log(`SENT: ${endpoint} ${param||''}`,'info');
    }else{
        fetch(`http://${deviceIP}/api/${endpoint}`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(payload),
            mode:'cors'
        }).then(()=>log(`SENT: ${endpoint}`,'ok'))
        .catch(()=>log(`FAIL: ${endpoint}`,'err'));
    }
}

async function fetchBattery(){
    if(!connected) return;
    try{
        const res = await fetch(`http://${deviceIP}/api/battery`);
        const data = await res.json();
        document.getElementById('battLevel').textContent = data.level+'%';
    }catch(e){}
}

// Auto refresh battery every 30s
setInterval(fetchBattery,30000);

// Enter key to connect
document.getElementById('ipInput').addEventListener('keydown',(e)=>{
    if(e.key==='Enter') toggleConnection();
});

log('[SYSTEM] Ready. Input IP HP target & connect.','info');
</script>
</body>
</html>
