<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senter Controller - Gransdraknet</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui;}
        body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;padding:20px;}
        .container{background:#0d0d0d;border:1px solid #222;border-radius:20px;padding:30px;text-align:center;max-width:400px;width:100%;box-shadow:0 0 40px rgba(0,0,0,0.8);}
        h2{color:#fff;margin-bottom:5px;font-size:1.5em;letter-spacing:2px;}
        .sub{color:#666;font-size:0.7em;margin-bottom:20px;}
        .ip-input{width:100%;padding:14px;background:#111;border:1px solid #333;color:#ff0;border-radius:10px;text-align:center;font-size:0.9em;margin-bottom:10px;outline:none;}
        .ip-input:focus{border-color:#ffaa00;}
        .btn-connect{width:100%;padding:12px;background:#1a1a1a;border:1px solid #444;color:#fff;border-radius:10px;cursor:pointer;font-weight:bold;margin-bottom:20px;transition:.2s;}
        .btn-connect:hover{background:#222;border-color:#ffaa00;}
        .btn-connect.connected{background:#002200;border-color:#00ff00;color:#0f0;}
        .senter-btn{width:150px;height:150px;border-radius:50%;border:3px solid #333;background:#111;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;}
        .senter-btn::before{content:'🔦';font-size:4em;transition:.3s;}
        .senter-btn.on{background:#331100;border-color:#ffaa00;box-shadow:0 0 60px rgba(255,170,0,0.8),0 0 120px rgba(255,170,0,0.4);animation:pulse 1.5s infinite;}
        .senter-btn.on::before{content:'💡';filter:brightness(2);}
        @keyframes pulse{0%,100%{box-shadow:0 0 60px rgba(255,170,0,0.8),0 0 120px rgba(255,170,0,0.4);}50%{box-shadow:0 0 90px rgba(255,170,0,1),0 0 180px rgba(255,170,0,0.6);}}
        .status{color:#888;margin-top:15px;font-size:0.8em;min-height:20px;}
        .status.error{color:#ff3333;}
        .status.success{color:#00ff00;}
        .status.loading{color:#ffaa00;}
        .footer{color:#222;font-size:0.6em;margin-top:20px;}
    </style>
</head>
<body>
    <div class="container">
        <h2>🔦 SENTER CONTROL</h2>
        <p class="sub">Gransdraknet v12 | Direct IP Connect</p>
        
        <input type="text" class="ip-input" id="ipInput" placeholder="192.168.x.x:8080" value="192.168.1.10:8080">
        <button class="btn-connect" id="btnConnect" onclick="connect()">🔗 SAMBUNGKAN</button>
        
        <div class="senter-btn" id="senterBtn" onclick="toggleSenter()"></div>
        <div class="status" id="status">Masukkan IP, lalu sambungkan</div>
    </div>
    <div class="footer">GRANSDRAKNET CONTROL CENTER | AldzX505</div>

    <script>
        let targetIP = '';
        let isOn = false;
        let connected = false;
        const senterBtn = document.getElementById('senterBtn');
        const statusEl = document.getElementById('status');
        const btnConnect = document.getElementById('btnConnect');
        const ipInput = document.getElementById('ipInput');

        function setStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + type;
        }

        async function connect() {
            targetIP = ipInput.value.trim();
            if (!targetIP) return setStatus('Isi IP dulu, broo!', 'error');
            
            setStatus('Menyambungkan...', 'loading');
            try {
                const res = await fetch(`http://${targetIP}/api/ping`, {
                    signal: AbortSignal.timeout(3000)
                });
                if (res.ok) {
                    connected = true;
                    btnConnect.textContent = '✅ TERHUBUNG';
                    btnConnect.classList.add('connected');
                    setStatus('Terhubung! Senter siap digunakan.', 'success');
                } else {
                    throw new Error('Gagal');
                }
            } catch (e) {
                connected = false;
                btnConnect.textContent = '🔗 SAMBUNGKAN';
                btnConnect.classList.remove('connected');
                setStatus('Gagal sambung. Cek IP & pastikan server aktif.', 'error');
            }
        }

        async function toggleSenter() {
            if (!connected) return setStatus('Sambungkan dulu ke device!', 'error');
            
            const cmd = isOn ? 'off' : 'on';
            setStatus(isOn ? 'Mematikan senter...' : 'Menyalakan senter...', 'loading');
            
            try {
                const res = await fetch(`http://${targetIP}/api/flashlight/${cmd}`, {
                    method: 'POST',
                    signal: AbortSignal.timeout(2000)
                });
                if (res.ok) {
                    isOn = !isOn;
                    senterBtn.classList.toggle('on', isOn);
                    setStatus(isOn ? '✅ SENTER MENYALA' : '⚫ SENTER MATI', isOn ? 'success' : 'success');
                } else {
                    throw new Error('Gagal');
                }
            } catch (e) {
                setStatus('Gagal kirim perintah. Koneksi putus?', 'error');
                connected = false;
                btnConnect.textContent = '🔗 SAMBUNGKAN';
                btnConnect.classList.remove('connected');
            }
        }

        ipInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') connect();
        });
    </script>
</body>
</html>
