<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🔥 DarkDroid Control</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #080c18;
      color: #00f0ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .container {
      background: #101828;
      border-radius: 40px;
      padding: 28px 22px;
      max-width: 420px;
      width: 100%;
      border: 1px solid #00f0ff40;
      box-shadow: 0 0 60px #00f0ff15, inset 0 0 60px #00f0ff05;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #00f0ff80;
      text-transform: uppercase;
    }
    .status-badge {
      background: #00f0ff20;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 11px;
      border: 1px solid #00f0ff60;
      color: #00f0ff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .btn {
      background: #1a243b;
      border: 1px solid #00f0ff30;
      border-radius: 24px;
      padding: 18px 0;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.12s ease;
      box-shadow: 0 4px 0 #00000040;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      line-height: 1.2;
      user-select: none;
    }
    .btn .icon {
      font-size: 26px;
      display: block;
    }
    .btn:active {
      transform: scale(0.93);
      background: #00f0ff;
      color: #080c18;
      border-color: #00f0ff;
      box-shadow: 0 0 30px #00f0ff80;
    }
    .btn-wide {
      grid-column: span 3;
      padding: 16px 0;
      background: #00f0ff15;
      border-color: #00f0ff70;
    }
    .btn-wide:active {
      background: #00f0ff;
      color: #000;
    }
    .log-area {
      background: #060b14;
      border-radius: 24px;
      padding: 14px 18px;
      margin-top: 16px;
      border-left: 4px solid #00f0ff;
      font-size: 13px;
      min-height: 50px;
      max-height: 80px;
      overflow-y: auto;
      color: #aaccff;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      word-break: break-all;
    }
    .ip-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 40px;
      border: 1px solid #00f0ff40;
      background: #060b14;
      color: #fff;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
      transition: 0.2s;
      text-align: center;
    }
    .ip-input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 30px #00f0ff30;
    }
    .connect-btn {
      width: 100%;
      padding: 14px;
      border-radius: 40px;
      border: none;
      background: #00f0ff;
      color: #080c18;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .connect-btn:active {
      transform: scale(0.96);
      opacity: 0.8;
    }
    .disconnect {
      background: #ff004030;
      color: #ff0040;
      border-color: #ff004060;
    }
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-thumb {
      background: #00f0ff60;
      border-radius: 10px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .btn-small {
      padding: 14px 0;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>⚡ DroidX</h1>
    <span class="status-badge" id="connStatus">🔴 OFFLINE</span>
  </div>

  <input type="text" class="ip-input" id="ipInput" placeholder="IP Kartu lo, misal 192.168.1.100" value="192.168.1.100">
  <button class="connect-btn" id="connectBtn">🔗 Sambung</button>

  <div class="grid">
    <div class="btn" data-cmd="flash_on"><span class="icon">💡</span> Senter ON</div>
    <div class="btn" data-cmd="flash_off"><span class="icon">🔦</span> Senter OFF</div>
    <div class="btn" data-cmd="camera"><span class="icon">📸</span> Kamera</div>
    <div class="btn" data-cmd="youtube"><span class="icon">▶️</span> YouTube</div>
    <div class="btn" data-cmd="tiktok"><span class="icon">🎵</span> TikTok</div>
    <div class="btn" data-cmd="screenshot"><span class="icon">🖼️</span> Screenshot</div>
    <div class="btn" data-cmd="volume_up"><span class="icon">🔊</span> Vol +</div>
    <div class="btn" data-cmd="volume_down"><span class="icon">🔉</span> Vol -</div>
    <div class="btn" data-cmd="mute"><span class="icon">🔇</span> Mute</div>
  </div>

  <div class="row-2">
    <div class="btn btn-small" data-cmd="open_whatsapp"><span class="icon">💬</span> WA</div>
    <div class="btn btn-small" data-cmd="open_instagram"><span class="icon">📷</span> IG</div>
  </div>

  <div class="btn btn-wide" data-cmd="vibrate"><span class="icon">📳</span> Getar 5x</div>

  <div class="log-area" id="logArea">⚡ Siap kendali...</div>
</div>

<script>
(function() {
  let socket = null;
  let isConnected = false;
  const logArea = document.getElementById('logArea');
  const connStatus = document.getElementById('connStatus');
  const ipInput = document.getElementById('ipInput');
  const connectBtn = document.getElementById('connectBtn');

  function updateStatus(connected) {
    isConnected = connected;
    connStatus.textContent = connected ? '🟢 ONLINE' : '🔴 OFFLINE';
    connStatus.style.color = connected ? '#00f0ff' : '#ff4060';
    connectBtn.textContent = connected ? '⛔ Putus' : '🔗 Sambung';
    connectBtn.classList.toggle('disconnect', connected);
  }

  function log(msg) {
    logArea.textContent = `> ${msg}`;
    logArea.scrollTop = logArea.scrollHeight;
  }

  function sendCommand(cmd) {
    if (!isConnected || !socket) {
      log('❌ Belum konek!');
      return;
    }
    socket.emit('command', cmd);
    log(`📤 ${cmd}`);
  }

  function connectSocket() {
    if (socket) {
      socket.disconnect();
      socket = null;
      updateStatus(false);
      log('⛔ Koneksi diputus');
      return;
    }

    let ip = ipInput.value.trim();
    if (!ip) {
      log('❌ Isi IP dulu bro!');
      return;
    }
    if (!ip.match(/^(\d{1,3}\.){3}\d{1,3}$/)) {
      log('❌ IP format salah!');
      return;
    }

    const url = `http://${ip}:3000`;
    log(`⏳ Nyambung ke ${url}...`);

    try {
      socket = io(url, {
        transports: ['websocket', 'polling'],
        timeout: 5000,
        reconnection: false
      });

      socket.on('connect', () => {
        updateStatus(true);
        log('✅ Konek! Siap kendali');
      });

      socket.on('connect_error', (err) => {
        log(`❌ Gagal: ${err.message}`);
        updateStatus(false);
        socket.disconnect();
        socket = null;
      });

      socket.on('disconnect', () => {
        updateStatus(false);
        log('⛔ Koneksi putus');
        socket = null;
      });

      socket.on('status', (msg) => {
        log(`📩 ${msg}`);
      });

    } catch (e) {
      log(`❌ Error: ${e.message}`);
      updateStatus(false);
      socket = null;
    }
  }

  // Event listeners
  connectBtn.addEventListener('click', connectSocket);

  document.querySelectorAll('.btn[data-cmd]').forEach(el => {
    el.addEventListener('click', (e) => {
      const cmd = el.dataset.cmd;
      if (cmd) sendCommand(cmd);
    });
  });

  // Auto-connect jika IP diisi default
  window.addEventListener('load', () => {
    log('🔥 DarkDroid siap');
  });
})();
</script>
</body>
</html>
